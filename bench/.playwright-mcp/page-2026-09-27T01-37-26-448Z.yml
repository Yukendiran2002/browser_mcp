              - paragraph [ref=e71]:
                - text: HTTPX is a fully featured HTTP client library for Python 3. It includes
                - strong [ref=e72]: an integrated command line client
                - text: ", has support for both"
                - strong [ref=e73]: HTTP/1.1 and HTTP/2
                - text: ", and provides both"
                - strong [ref=e74]: sync and async APIs
                - text: .
              - separator [ref=e75]
              - paragraph [ref=e76]: "Install HTTPX using pip:"
              - generic [ref=e77]: $ pip install httpx
              - paragraph [ref=e78]: "Now, let's get started:"
              - generic [ref=e79]: ">>> import httpx >>> r = httpx.get('https://www.example.org/') >>> r <Response [200 OK]> >>> r.status_code 200 >>> r.headers['content-type'] 'text/html; charset=UTF-8' >>> r.text '<!doctype html>\\n<html>\\n<head>\\n<title>Example Domain</title>...'"
              - paragraph [ref=e80]: Or, using the command-line client.
              - generic [ref=e81]: "$ pip install 'httpx[cli]' # The command line client is an optional dependency."
              - paragraph [ref=e82]: Which now allows us to use HTTPX directly from the command-line...
              - paragraph [ref=e83]:
                - img "httpx --help" [ref=e84]
              - paragraph [ref=e85]: Sending a request...
              - paragraph [ref=e86]:
                - img "httpx http://httpbin.org/json" [ref=e87]
              - heading "Features" [level=2] [ref=e88]:
                - link:
                  - /url: "#user-content-features"
                - text: Features
              - paragraph [ref=e89]:
                - text: HTTPX builds on the well-established usability of
                - code [ref=e90]: requests
                - text: ", and gives you:"
              - list [ref=e91]:
                - listitem [ref=e92]:
                  - text: A broadly
                  - link "requests-compatible API" [ref=e93] [cursor=pointer]:
                    - /url: https://www.python-httpx.org/compatibility/
                  - text: .
                - listitem [ref=e94]: An integrated command-line client.
                - listitem [ref=e95]:
                  - text: HTTP/1.1
                  - link "and HTTP/2 support" [ref=e96] [cursor=pointer]:
                    - /url: https://www.python-httpx.org/http2/
                  - text: .
                - listitem [ref=e97]:
                  - text: Standard synchronous interface, but with
                  - link "async support if you need it" [ref=e98] [cursor=pointer]:
                    - /url: https://www.python-httpx.org/async/
                  - text: .
                - listitem [ref=e99]:
                  - text: Ability to make requests directly to
                  - link "WSGI applications" [ref=e100] [cursor=pointer]:
                    - /url: https://www.python-httpx.org/advanced/transports/#wsgi-transport
                  - text: or
                  - link "ASGI applications" [ref=e101] [cursor=pointer]:
                    - /url: https://www.python-httpx.org/advanced/transports/#asgi-transport
                  - text: .
                - listitem [ref=e102]: Strict timeouts everywhere.
                - listitem [ref=e103]: Fully type annotated.
                - listitem [ref=e104]: 100% test coverage.
              - paragraph [ref=e105]:
                - text: Plus all the standard features of
                - code [ref=e106]: requests
                - text: ...
              - list [ref=e107]:
                - listitem [ref=e108]: International Domains and URLs
                - listitem [ref=e109]: Keep-Alive & Connection Pooling
                - listitem [ref=e110]: Sessions with Cookie Persistence
                - listitem [ref=e111]: Browser-style SSL Verification
                - listitem [ref=e112]: Basic/Digest Authentication
                - listitem [ref=e113]: Elegant Key/Value Cookies
                - listitem [ref=e114]: Automatic Decompression
                - listitem [ref=e115]: Automatic Content Decoding
                - listitem [ref=e116]: Unicode Response Bodies
                - listitem [ref=e117]: Multipart File Uploads
                - listitem [ref=e118]: HTTP(S) Proxy Support
                - listitem [ref=e119]: Connection Timeouts
                - listitem [ref=e120]: Streaming Downloads
                - listitem [ref=e121]: .netrc Support
                - listitem [ref=e122]: Chunked Requests
